version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hc-dashboard-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/healthcare_db?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=b65d1d6a8b79e2a9b20d3f8216b2a0c4f8b2d1c6e0f3d6a8b7e2c9d1b6a8c4f2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hc-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: hc-dashboard-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=healthcare_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hc-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hc-dashboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - hc-network
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  hc-network:
    driver: bridge
